name: roadalert_app
description: RoadAlert employee app - share journeys, report road problems, get alerts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  geolocator: ^12.0.0
  shared_preferences: ^2.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
